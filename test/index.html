<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云南大学社团招新</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>云南大学社团招新</h1>
    <p>选一个社团，把报名信息交给我们。</p>
  </header>
  <nav>
    <a href="#intro">招新说明</a>
    <a href="#form">开始报名</a>
  </nav>
  <main>
    <section id="intro">
      <h2>招新说明</h2>
      <p>面向全校在读学生开放。多个社团招新。</p>
      <p>提交后由各社团负责人审核通过。</p>
    </section>
    <section id="form">
      <h2>报名表单</h2>
      <form action="#" method="post">
        <p>
          <label for="name">姓名</label>
          <input type="text" id="name" name="name" placeholder="怎么称呼你" required maxlength="20">
        </p>
        <p>
          <label for="mail">邮箱</label>
          <input type="email" id="mail" name="mail" placeholder="用于通知面试" required>
        </p>
        <p>
          <label for="querypwd">查询密码</label>
          <input type="password" id="querypwd" name="querypwd" placeholder="6到12位字母或数字" required minlength="6" maxlength="12" pattern="[A-Za-z0-9]{6,12}">
        </p>
        <p>
          <label for="enrollYear">入学年份</label>
          <input type="number" id="enrollYear" name="enrollYear" placeholder="例如 2024" required min="2020" max="2026">
        </p>
        <p>
          <label for="interviewDate">可面试日期</label>
          <input type="date" id="interviewDate" name="interviewDate" required min="2026-09-07" max="2026-09-30">
        </p>
        <p>年级</p>
        <p>
          <label><input type="radio" name="grade" value="1" required> 大一</label>
          <label><input type="radio" name="grade" value="2"> 大二</label>
          <label><input type="radio" name="grade" value="3"> 大三</label>
          <label><input type="radio" name="grade" value="4"> 大四</label>
        </p>
        <p>可参与的方向（可多选）</p>
        <p>
          <label><input type="checkbox" name="skill" value="write"> 撰稿</label>
          <label><input type="checkbox" name="skill" value="photo"> 拍摄</label>
          <label><input type="checkbox" name="skill" value="volunteer"> 志愿</label>
          <label><input type="checkbox" name="skill" value="ball"> 篮球</label>
        </p>
        <p>
          <label for="club">意向社团</label>
          <select id="club" name="club" required>
            <option value="">请选择</option>
            <option value="literature">青木文学社</option>
            <option value="photo">拾光摄影社</option>
            <option value="volunteer">青行志愿社</option>
            <option value="basketball">南风篮球队</option>
          </select>
        </p>
        <p>
          <label for="intro">自我介绍</label>
          <textarea id="intro" name="intro" rows="4" maxlength="200" placeholder="为什么想加入，做过什么" required></textarea>
        </p>
        <p>
          <label for="attachment">附件（学生证或作品）</label>
          <input type="file" id="attachment" name="attachment">
        </p>
        <p>
          <button type="submit">提交报名</button>
        </p>
      </form>
    </section>
  </main>
  <footer>
    <p>软件开发综合实践 · 课程演示案例</p>
  </footer>
</body>
</html>
